<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #ccc; height: 70px; box-sizing: border-box; flex-shrink: 0; }
        #header-title { flex-grow: 1; text-align: center; }
        #header-title h1, #header-title p { margin: 0; }
        #logout-btn { width: 85px; padding: 8px 12px; cursor: pointer; background-color: #f44336; color: white; border: none; border-radius: 4px; }
        .header-spacer { width: 85px; flex-shrink: 0; }
        .container { display: flex; flex-grow: 1; overflow: hidden; }
        #side-panel { width: 300px; border-right: 1px solid #ccc; padding: 20px; box-sizing: border-box; overflow-y: auto; flex-shrink: 0; }
        #main-panel { flex-grow: 1; display: flex; flex-direction: column; }
        #main-content-placeholder { text-align: center; padding: 20px; }
        #chat-view { display: none; flex-direction: column; height: 100%; }
        #chat-header { padding: 10px; border-bottom: 1px solid #ccc; font-size: 1.2em; font-weight: bold; text-align: center; }
        #message-container { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message { max-width: 70%; min-width: 20%; padding: 10px; padding-bottom: 25px; border-radius: 10px; margin-bottom: 10px; word-wrap: break-word; position: relative; }
        .message-header { font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        .message-text { font-size: 1em; }
        .message-time { font-size: 0.75em; color: #888; position: absolute; bottom: 5px; right: 10px; }
        .message.support { background-color: #dcf8c6; align-self: flex-end; }
        .message.client { background-color: #f1f0f0; align-self: flex-start; }
        #message-input-container { padding: 10px; border-top: 1px solid #ccc; display: flex; }
        #message-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #send-btn { width: 100px; padding: 10px; margin-left: 10px; }
        .collapsible-header { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; }
        .add-btn { cursor: pointer; font-size: 20px; padding: 0 10px; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 5px; }
        .group-item-container, .user-item, .chat-item { padding: 4px 0; }
        .group-item, .subgroup-item, .user-item { display: flex; justify-content: space-between; align-items: center; }
        .group-name, .user-name, .chat-name { cursor: pointer; flex-grow: 1; }
        .actions { margin-left: auto; white-space: nowrap; }
        .actions span { cursor: pointer; margin-left: 8px; font-size: 16px; }
        .subgroup-list { display: none; padding-left: 20px; margin-top: 5px; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-btn:hover, .close-btn:focus { color: black; text-decoration: none; cursor: pointer; }
        .form-row { margin-bottom: 10px; }
        .form-row label { display: block; margin-bottom: 5px; }
        .form-row input[type="text"], .form-row input[type="email"], .form-row input[type="password"], .form-row select { width: 95%; padding: 8px; }
    </style>
</head>
<body>
    <div id="header">
        <div class="header-spacer"></div>
        <div id="header-title"><h1>Служба поддержки</h1><p style="margin:0;">Система управления</p></div>
        <button id="logout-btn">Выход</button>
    </div>
    <div class="container">
        <div id="side-panel">
            <div id="chats-header" class="collapsible-header"><h2>Чаты</h2></div>
            <ul id="chat-list" style="display: none;"></ul>
            <div id="chat-error" style="color: red;"></div>

            <div id="users-header" class="collapsible-header"><h2>Пользователи</h2><span class="add-btn" id="add-user-btn">+</span></div>
            <ul id="user-list" style="display: none;"></ul>
            <div id="user-error" style="color: red;"></div>

            <div id="groups-header" class="collapsible-header"><h2>Группы</h2><span class="add-btn" id="add-group-btn">+</span></div>
            <ul id="group-list" style="display: none;"></ul>
            <div id="group-error" style="color: red;"></div>
        </div>
        <div id="main-panel">
            <div id="main-content-placeholder">
                <h2>Выберите чат для просмотра</h2>
            </div>
            <div id="chat-view">
                <div id="chat-header"></div>
                <div id="message-container"></div>
                <div id="message-input-container">
                    <input type="text" id="message-input" placeholder="Введите сообщение...">
                    <button id="send-btn">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="userModal" class="modal"><div class="modal-content"><span class="close-btn">&times;</span><h3 id="userModalTitle"></h3><form id="userForm"><input type="hidden" id="userId"><div class="form-row"><label>Username: <input type="text" id="username" required></label></div><div class="form-row" id="password-row"><label>Password: <input type="password" id="password"></label></div><div class="form-row"><label>Name: <input type="text" id="name" required></label></div><div class="form-row"><label>Email: <input type="email" id="email"></label></div><div class="form-row"><label>Role: <select id="role"></select></label></div><div class="form-row"><label><input type="checkbox" id="isDisabled"> Disabled</label></div><button type="submit">Сохранить</button></form></div></div>
    <div id="groupModal" class="modal"><div class="modal-content"><span class="close-btn">&times;</span><h3 id="groupModalTitle"></h3><form id="groupForm"><input type="hidden" id="groupId"><input type="text" id="groupName" placeholder="Название группы" required style="width: 95%; padding: 8px;"><button type="submit" style="margin-top: 10px;">Сохранить</button></form></div></div>
    <div id="subgroupModal" class="modal"><div class="modal-content"><span class="close-btn">&times;</span><h3 id="subgroupModalTitle"></h3><form id="subgroupForm"><input type="hidden" id="subgroupId"><input type="hidden" id="parentGroupId"><input type="text" id="subgroupName" placeholder="Название подгруппы" required style="width: 95%; padding: 8px;"><button type="submit" style="margin-top: 10px;">Сохранить</button></form></div></div>

    <script>
    // --- AUTH & FETCH WRAPPER ---
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) { return null; }
    }

    async function fetchWithAuth(url, options = {}) {
        let token = localStorage.getItem('accessToken');
        if (!token) {
            window.location.href = '/login.html';
            throw new Error('No token found');
        }

        const decodedToken = parseJwt(token);
        if (decodedToken && decodedToken.exp * 1000 < Date.now() + 30000) { // 30-second buffer
            console.log('Access token expired, refreshing...');
            try {
                const refreshResponse = await fetch('/api/auth/refresh', { method: 'POST' });
                if (!refreshResponse.ok) throw new Error('Refresh failed');

                const newTokenData = await refreshResponse.json();
                token = newTokenData.token;
                localStorage.setItem('accessToken', token);
                console.log('Token refreshed successfully.');
            } catch (error) {
                console.error('Session expired, redirecting to login.', error);
                localStorage.removeItem('accessToken');
                window.location.href = '/login.html';
                throw new Error('Session expired');
            }
        }

        const newOptions = { ...options };
        newOptions.headers = { ...newOptions.headers, 'Authorization': 'Bearer ' + token };

        return fetch(url, newOptions);
    }

    document.addEventListener('DOMContentLoaded', async function() {
        if (!localStorage.getItem('accessToken')) {
            window.location.href = '/login.html';
            return;
        }

        let availableRoles = [];
        try {
            const response = await fetchWithAuth('/api/roles');
            if (!response.ok) throw new Error('Could not fetch roles');
            availableRoles = await response.json();
        } catch (error) {
            console.error(error);
            document.getElementById('user-error').textContent = 'Failed to load roles. User management is disabled.';
        }

        let currentChatId = null;

        // --- WEBSOCKET SETUP ---
        function connectWebSocket() {
            const token = localStorage.getItem('accessToken');
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?token=${token}`;
            const socket = new WebSocket(wsUrl);

            socket.onopen = () => console.log("WebSocket connection established.");
            socket.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received WebSocket message:', message);
                    if (message.path === '/users') {
                        console.log('User list update received. Refreshing...');
                        fetchAndRenderUsers();
                    }
                    if (message.path && message.path.startsWith('/chats')) {
                        console.log('Chat update received. Refreshing chat list...');
                        fetchAndRenderChats();
                        if (currentChatId) {
                            console.log(`Refreshing currently open chat: ${currentChatId}`);
                            fetchAndRenderChatDetails(currentChatId);
                        }
                    }
                } catch (e) { console.error('Error parsing WebSocket message:', e); }
            };
            socket.onclose = () => setTimeout(connectWebSocket, 5000);
            socket.onerror = (error) => console.error("WebSocket error:", error);
        }

        // --- LOGOUT ---
        document.getElementById('logout-btn').addEventListener('click', async function() {
            try {
                await fetchWithAuth('/api/auth/logout', { method: 'POST' });
            } finally {
                localStorage.removeItem('accessToken');
                window.location.href = '/login.html';
            }
        });

        const userList = document.getElementById('user-list');
        const groupList = document.getElementById('group-list');
        const chatList = document.getElementById('chat-list');
        const mainContentPlaceholder = document.getElementById('main-content-placeholder');
        const chatView = document.getElementById('chat-view');
        const chatHeader = document.getElementById('chat-header');
        const messageContainer = document.getElementById('message-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const userModal = document.getElementById('userModal');
        const userForm = document.getElementById('userForm');
        const groupModal = document.getElementById('groupModal');
        const groupForm = document.getElementById('groupForm');
        const subgroupModal = document.getElementById('subgroupModal');
        const subgroupForm = document.getElementById('subgroupForm');

        // --- COLLAPSIBLE HEADERS ---
        document.getElementById('chats-header').addEventListener('click', (e) => {
            chatList.style.display = chatList.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('users-header').addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() !== 'span') {
                userList.style.display = userList.style.display === 'none' ? 'block' : 'none';
            }
        });
        document.getElementById('groups-header').addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() !== 'span') {
                groupList.style.display = groupList.style.display === 'none' ? 'block' : 'none';
            }
        });

        // --- MODAL HANDLING ---
        function setupModal(modal, openBtn, closeBtnClass) {
            if (openBtn) openBtn.onclick = () => modal.style.display = 'block';
            modal.querySelector(closeBtnClass).onclick = () => modal.style.display = 'none';
            window.addEventListener('click', (event) => {
                if (event.target == modal) modal.style.display = 'none';
            });
        }
        setupModal(userModal, document.getElementById('add-user-btn'), '.close-btn');
        setupModal(groupModal, document.getElementById('add-group-btn'), '.close-btn');
        setupModal(subgroupModal, null, '.close-btn');

        // --- CHAT VIEW LOGIC ---
        async function fetchAndRenderChatDetails(chatId) {
            try {
                const response = await fetchWithAuth(`/api/chats/${chatId}`);
                if (!response.ok) throw new Error('Failed to fetch chat details');
                const chatDetails = await response.json();
                renderChatDetails(chatDetails);
            } catch (error) {
                console.error('Error fetching chat details:', error);
                alert('Could not load chat.');
            }
        }

        function renderChatDetails(chat) {
            currentChatId = chat.id;
            mainContentPlaceholder.style.display = 'none';
            chatView.style.display = 'flex';
            chatHeader.textContent = chat.name;
            messageContainer.innerHTML = '';

            let allMessages = [];
            if (chat.connections) {
                chat.connections.forEach(conn => {
                    if (conn.messages) {
                        conn.messages.forEach(msg => {
                            allMessages.push({
                                ...msg,
                                senderName: msg.isSupport ? (conn.user ? conn.user.name : 'Support') : chat.name
                            });
                        });
                    }
                });
            }

            allMessages.sort((a, b) => new Date(a.date) - new Date(b.date));

            allMessages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.isSupport ? 'support' : 'client'}`;
                const time = new Date(msg.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                msgDiv.innerHTML = `<div class="message-header">${msg.senderName}</div><div class="message-text">${msg.text}</div><div class="message-time">${time}</div>`;
                messageContainer.appendChild(msgDiv);
            });

            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        chatList.addEventListener('click', (event) => {
            const chatItem = event.target.closest('.chat-item');
            if (chatItem) {
                const chatId = chatItem.dataset.id;
                fetchAndRenderChatDetails(chatId);
            }
        });

        sendBtn.addEventListener('click', async () => {
            const messageText = messageInput.value.trim();
            if (!messageText || !currentChatId) return;

            try {
                const response = await fetchWithAuth(`/api/chats/${currentChatId}/message/support`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: messageText })
                });
                if (!response.ok) throw new Error('Failed to send message');
                messageInput.value = '';
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Could not send message.');
            }
        });

        // --- USER LOGIC ---
        function openUserModal(title, user = {}) {
            userModal.querySelector('#userModalTitle').textContent = title;
            userForm.userId.value = user.id || '';
            userForm.username.value = user.username || '';
            userForm.name.value = user.name || '';
            userForm.email.value = user.email || '';
            userForm.isDisabled.checked = user.disabled || false;
            const roleSelect = userForm.role;
            roleSelect.innerHTML = '';
            availableRoles.forEach(role => {
                const option = new Option(role.name, role.id);
                option.selected = user.role && user.role.id === role.id;
                roleSelect.add(option);
            });
            const passwordRow = document.getElementById('password-row');
            if (user.id) {
                passwordRow.style.display = 'none';
                userForm.password.required = false;
            } else {
                passwordRow.style.display = 'block';
                userForm.password.required = true;
            }
            userModal.style.display = 'block';
        }

        userForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const id = userForm.userId.value;
            const selectedRole = availableRoles.find(r => r.id === userForm.role.value);
            const userData = { name: userForm.name.value, username: userForm.username.value, email: userForm.email.value, disabled: userForm.isDisabled.checked, role: selectedRole };
            const url = id ? `/api/users/${id}` : '/api/users';
            const method = id ? 'PUT' : 'POST';
            if (!id) userData.password = userForm.password.value;
            try {
                const response = await fetchWithAuth(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(userData) });
                if (!response.ok) throw new Error('User operation failed');
                fetchAndRenderUsers();
                userModal.style.display = 'none';
            } catch (error) { alert('Error: ' + error.message); }
        });

        userList.addEventListener('click', async function(event) {
            if (event.target.classList.contains('edit-user-btn')) {
                const userId = event.target.closest('li').dataset.id;
                try {
                    const response = await fetchWithAuth(`/api/users`);
                    if (!response.ok) throw new Error('Could not fetch users');
                    const users = await response.json();
                    const userToEdit = users.find(u => u.id === userId);
                    if(userToEdit) openUserModal('Изменить пользователя', userToEdit);
                } catch (error) { alert('Error: ' + error.message); }
            }
        });

        // --- GROUP LOGIC ---
        function openGroupModal(title, id = '', name = '') {
            groupModal.querySelector('#groupModalTitle').textContent = title;
            groupForm.groupId.value = id;
            groupForm.groupName.value = name;
            groupModal.style.display = 'block';
        }

        groupForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const id = groupForm.groupId.value;
            const name = groupForm.groupName.value;
            const url = id ? `/api/groups/${id}` : '/api/groups';
            const method = id ? 'PUT' : 'POST';
            try {
                const response = await fetchWithAuth(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name }) });
                if (!response.ok) throw new Error('Group operation failed');
                fetchAndRenderGroups();
                groupModal.style.display = 'none';
            } catch (error) { alert('Error: ' + error.message); }
        });

        // --- SUBGROUP LOGIC ---
        function openSubgroupModal(title, parentGroupId, subgroupId = '', subgroupName = '') {
            subgroupModal.querySelector('#subgroupModalTitle').textContent = title;
            subgroupForm.parentGroupId.value = parentGroupId;
            subgroupForm.subgroupId.value = subgroupId;
            subgroupForm.subgroupName.value = subgroupName;
            subgroupModal.style.display = 'block';
        }

        subgroupForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const parentGroupId = subgroupForm.parentGroupId.value;
            const subgroupId = subgroupForm.subgroupId.value;
            const name = subgroupForm.subgroupName.value;
            const isEditing = !!subgroupId;
            const url = isEditing ? `/api/subgroups/${subgroupId}` : `/api/subgroups?groupId=${parentGroupId}`;
            const method = isEditing ? 'PUT' : 'POST';
            try {
                const response = await fetchWithAuth(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name }) });
                if (!response.ok) throw new Error('Subgroup operation failed');
                fetchAndRenderGroups();
                subgroupModal.style.display = 'none';
            } catch (error) { alert('Error: ' + error.message); }
        });

        // --- LIST EVENT DELEGATION (Groups & Subgroups) ---
        groupList.addEventListener('click', async function(event) {
            const target = event.target;
            const groupContainer = target.closest('.group-item-container');
            if (!groupContainer) return;
            const groupId = groupContainer.dataset.groupId;
            const groupName = groupContainer.querySelector('.group-name').textContent.trim();

            if (target.classList.contains('group-name')) {
                const subgroupList = groupContainer.querySelector('.subgroup-list');
                if (subgroupList) subgroupList.style.display = subgroupList.style.display === 'none' ? 'block' : 'none';
            }
            if (target.classList.contains('add-subgroup-btn')) openSubgroupModal('Новая подгруппа', groupId);
            if (target.classList.contains('edit-group-btn')) openGroupModal('Изменить группу', groupId, groupName);
            if (target.classList.contains('delete-group-btn')) {
                if (confirm(`Удалить группу "${groupName}"?`)) {
                    try {
                        const response = await fetchWithAuth(`/api/groups/${groupId}`, { method: 'DELETE' });
                        if (!response.ok) throw new Error('Delete failed');
                        fetchAndRenderGroups();
                    } catch (error) { alert('Error: ' + error.message); }
                }
            }

            const subgroupItem = target.closest('.subgroup-item');
            if (subgroupItem) {
                const subgroupId = subgroupItem.dataset.subgroupId;
                const subgroupName = subgroupItem.querySelector('span').textContent.trim();
                if (target.classList.contains('edit-subgroup-btn')) openSubgroupModal('Изменить подгруппу', groupId, subgroupId, subgroupName);
                if (target.classList.contains('delete-subgroup-btn')) {
                    if (confirm(`Удалить подгруппу "${subgroupName}"?`)) {
                        try {
                            const response = await fetchWithAuth(`/api/subgroups/${subgroupId}`, { method: 'DELETE' });
                            if (!response.ok) throw new Error('Delete failed');
                            fetchAndRenderGroups();
                        } catch (error) { alert('Error: ' + error.message); }
                    }
                }
            }
        });

        // --- DATA FETCHING & RENDERING ---
        async function fetchAndRenderChats() {
            try {
                const response = await fetchWithAuth('/api/chats');
                if (!response.ok) throw new Error(response.statusText);
                const chats = await response.json();
                chatList.innerHTML = '';
                chats.forEach(chat => {
                    const listItem = document.createElement('li');
                    listItem.className = 'chat-item';
                    listItem.setAttribute('data-id', chat.id);
                    listItem.innerHTML = `<div class="chat-name">${chat.name}</div>`;
                    chatList.appendChild(listItem);
                });
            } catch (error) {
                document.getElementById('chat-error').textContent = 'Error fetching chats: ' + error.message;
            }
        }

        async function fetchAndRenderUsers() {
            try {
                const response = await fetchWithAuth('/api/users');
                if (!response.ok) throw new Error(response.statusText);
                const users = await response.json();
                userList.innerHTML = '';
                users.forEach(user => {
                    const listItem = document.createElement('li');
                    listItem.className = 'user-item';
                    listItem.setAttribute('data-id', user.id);
                    listItem.innerHTML = `<div class="user-name">${user.name} (${user.username})</div><div class="actions"><span class="edit-user-btn">✏️</span></div>`;
                    userList.appendChild(listItem);
                });
            } catch (error) { document.getElementById('user-error').textContent = 'Error fetching users: ' + error.message; }
        }

        async function fetchAndRenderGroups() {
            try {
                const response = await fetchWithAuth('/api/groups');
                if (!response.ok) throw new Error(response.statusText);
                const groups = await response.json();
                groupList.innerHTML = '';
                groups.forEach(group => {
                    const listItem = document.createElement('li');
                    listItem.className = 'group-item-container';
                    listItem.setAttribute('data-group-id', group.id);
                    let subgroupsHtml = '';
                    if (group.subgroups && group.subgroups.length > 0) {
                        subgroupsHtml = '<ul class="subgroup-list">';
                        subgroupsHtml += group.subgroups.map(subgroup => `<li class="subgroup-item" data-subgroup-id="${subgroup.id}"><span>${subgroup.name}</span><div class="actions"><span class="edit-subgroup-btn">✏️</span><span class="delete-subgroup-btn">🗑️</span></div></li>`).join('');
                        subgroupsHtml += '</ul>';
                    }
                    listItem.innerHTML = `<div class="group-item"><div class="group-name">${group.name}</div><div class="actions"><span class="add-subgroup-btn">+</span><span class="edit-group-btn">✏️</span><span class="delete-group-btn">🗑️</span></div></div>${subgroupsHtml}`;
                    groupList.appendChild(listItem);
                });
            } catch (error) { document.getElementById('group-error').textContent = 'Error fetching groups: ' + error.message; }
        }

        // --- INITIAL LOAD ---
        fetchAndRenderChats();
        fetchAndRenderUsers();
        fetchAndRenderGroups();
        connectWebSocket();
    });
    </script>
</body>
</html>
