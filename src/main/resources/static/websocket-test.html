<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script>
        let socket;
        const subscriptions = {};

        function connect() {
            socket = new WebSocket('wss://10.222.222.76:9092/api/ws?token=eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJkYmFlNTlhZi01MDhjLTRhOWYtODBiZC0zZjVmODhjMmI3N2YiLCJyb2xlIjoiQURNSU4iLCJuYW1lIjoiQWRtaW4iLCJ0b2tlblR5cGUiOiJBQ0NFU1MiLCJlbWFpbCI6ImFkbWluQG1haWwucnUiLCJpYXQiOjE3NTQwMjg0MjUsImV4cCI6MTc1NDEwMDQyNX0.nabPIGEcr5aZ16pyLOltywTNvW9QU8E5q_8vGZNzagblSW1ZwR4mG8W-AiDSeaBM8FpaBj7QVdi99nvlfaRup66s9-Pys3BFL8tswVi0HzC6qoXJZGOTIkMlCZ3bXNu7__lZ80QLhg0PXcr8018XKCFG-Z6Tx81KUy1RxWDSkwqs3BImmGTlKdRyNPO0wpGAIraqZW0DEJkMHzAVrwwBP28qPFBDk-CwIhmW-8k5r3m8SEsRIV7JJy1KNMrNCHck6Kf_rvbYubCBud2k_2_NZh3DN6G1qoAm-EvA1vsCngvDMd93L9SI24jYllDDf-T5sKPAjBHXDWi8TFfxAm7Zrw');

            socket.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status').innerText = 'CONNECTED';
            };

            socket.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received:', message);

                    // Вызываем обработчик для соответствующего пути
                    if (subscriptions[message.path]) {
                        subscriptions[message.path].forEach(callback => {
                            callback(message);
                        });
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };

            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('status').innerText = 'ERROR';
            };

            socket.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('status').innerText = 'DISCONNECTED';
            };
        }

        function subscribe(path, callback) {
            if (!subscriptions[path]) {
                subscriptions[path] = [];
            }
            subscriptions[path].push(callback);
        }

        function displayGroupEvent(event) {
            const output = document.getElementById('group-output');
            output.innerHTML += `
                <div class="event">
                    <h3>${event.event}: ${event.data?.name || 'No name'}</h3>
                    <p>ID: ${event.data?.id || 'No ID'}</p>
                    <pre>${JSON.stringify(event.data, null, 2)}</pre>
                </div>
            `;
        }

        function displaySubgroupEvent(event) {
            const output = document.getElementById('subgroup-output');
            output.innerHTML += `
                <div class="event">
                    <h3>${event.event}: ${event.data?.name || 'No name'}</h3>
                    <p>ID: ${event.data?.id || 'No ID'}</p>
                    <p>Group: ${event.data?.group?.name || 'No group'}</p>
                    <pre>${JSON.stringify(event.data, null, 2)}</pre>
                </div>
            `;
        }

        function disconnect() {
            if (socket) {
                socket.close();
            }
        }

        window.onload = () => {
            connect();
            subscribe('/groups', displayGroupEvent);
            subscribe('/subgroups', displaySubgroupEvent);
        };
    </script>
    <style>
        /* Стили остаются такими же как в предыдущем примере */
    </style>
</head>
<body>
<h1>WebSocket Test</h1>
<button onclick="connect()">Connect</button>
<button onclick="disconnect()">Disconnect</button>

<div class="container">
    <div class="panel">
        <h2>Groups</h2>
        <div>Status: <span id="status" class="disconnected">DISCONNECTED</span></div>
        <div id="group-output"></div>
    </div>

    <div class="panel">
        <h2>Subgroups</h2>
        <div id="subgroup-output"></div>
    </div>
</div>
</body>
</html>
