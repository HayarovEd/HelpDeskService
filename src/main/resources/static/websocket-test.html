<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script>
        let socket;
        const subscriptions = {};

        function connect() {
            socket = new WebSocket('wss://localhost:9092/api/ws?token=eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJmYzQ5Mzg1OC1hYjBkLTRlOWUtYjM0MS0yMjZhYWM5MGZlOWQiLCJyb2xlIjoiQURNSU4iLCJuYW1lIjoiQWRtaW4iLCJ0b2tlblR5cGUiOiJBQ0NFU1MiLCJlbWFpbCI6ImFkbWluQG1haWwucnUiLCJpYXQiOjE3NTI2NTYwNTYsImV4cCI6MTc1MjcyODA1Nn0.d7DPNFEapZgr1gxILMMhwa9nx2hGyaGm08X7IRXhDQS2d3a3KUaABHNuHmudAyh99jFuB20Ycnz3rvWU8jFST2A783xMNQLEPbJPgjVeF_dvWktCvV6kikmoFJPOexfOrj8RnFYvKsEpJj0SzLnJKnoMmDtqbaGfFgm9ah5XqKCM9Qit6m1qLjaoMXdf4TheQ6_4McZw5kkqzVdF5jtkFWINzil7ZUs1ySS5HqJj9zwGFM2gyLlAoKXjZJSF-AizewGZ5y5gg4yUfRuCbD5vMH9i3SkE6QjrMfy9srQvH8HZsXlrOgUVLKQy5I7-UnpbFMO6UOK1f3WMnzvYDiBQBw');

            socket.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status').innerText = 'CONNECTED';
            };

            socket.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received:', message);

                    // Вызываем обработчик для соответствующего пути
                    if (subscriptions[message.path]) {
                        subscriptions[message.path].forEach(callback => {
                            callback(message);
                        });
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };

            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('status').innerText = 'ERROR';
            };

            socket.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('status').innerText = 'DISCONNECTED';
            };
        }

        function subscribe(path, callback) {
            if (!subscriptions[path]) {
                subscriptions[path] = [];
            }
            subscriptions[path].push(callback);
        }

        function displayGroupEvent(event) {
            const output = document.getElementById('group-output');
            output.innerHTML += `
                <div class="event">
                    <h3>${event.event}: ${event.data?.name || 'No name'}</h3>
                    <p>ID: ${event.data?.id || 'No ID'}</p>
                    <pre>${JSON.stringify(event.data, null, 2)}</pre>
                </div>
            `;
        }

        function displaySubgroupEvent(event) {
            const output = document.getElementById('subgroup-output');
            output.innerHTML += `
                <div class="event">
                    <h3>${event.event}: ${event.data?.name || 'No name'}</h3>
                    <p>ID: ${event.data?.id || 'No ID'}</p>
                    <p>Group: ${event.data?.group?.name || 'No group'}</p>
                    <pre>${JSON.stringify(event.data, null, 2)}</pre>
                </div>
            `;
        }

        function disconnect() {
            if (socket) {
                socket.close();
            }
        }

        window.onload = () => {
            connect();
            subscribe('/groups', displayGroupEvent);
            subscribe('/subgroups', displaySubgroupEvent);
        };
    </script>
    <style>
        /* Стили остаются такими же как в предыдущем примере */
    </style>
</head>
<body>
<h1>WebSocket Test</h1>
<button onclick="connect()">Connect</button>
<button onclick="disconnect()">Disconnect</button>

<div class="container">
    <div class="panel">
        <h2>Groups</h2>
        <div>Status: <span id="status" class="disconnected">DISCONNECTED</span></div>
        <div id="group-output"></div>
    </div>

    <div class="panel">
        <h2>Subgroups</h2>
        <div id="subgroup-output"></div>
    </div>
</div>
</body>
</html>
