debug: true

server:
  port: 9092
 # ssl:
  #  key-store: classpath:static/security/keystore.p12
  #  key-store-password: mypassword
 #   key-password: mypassword
 #   key-alias: mykey

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true


spring:
  application:
    name: help-desk-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  liquibase:
    change-log: classpath:/db/changelog/master.yml
    enabled: true

logging:
  config: classpath:logging/logback-master.xml

application:
  security:
    jwt:
      access-token:
        expiration: 1200 #minute
      refresh-token:
        length: 32
        expiration: 14400 #minute -> 10 day
      keys:
        public: ./src/main/resources/static/security/public_key.pem
        private: ./src/main/resources/static/security/private_key.pem

    admin:
      password: ${ADMIN_PASSWORD}

    cors-allowed-origins:
      - "http://localhost:3000"
      - "https://localhost:3000"
      - "http://localhost:9090"
      - "https://localhost:9090"
      - "http://localhost:9092"
      - "https://localhost:9092"
    public-endpoints:
      # api
      - method: POST
        path: /api/auth/*
      - method: GET
        path: /api/chats/*
      - method: POST
        path: /api/chats
      - method: POST
        path: /api/chats/{id}/messages
      - method: POST
        path: /api/chats/{id}/connections
      - method: POST
        path: /api/chats/{id}/message/client
      - method: POST
        path: /api/chats/{id}/close
      - method: GET

      # websocket
        path: /ws/**
      - method: GET

      # swagger
        path: /v2/api-docs
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /swagger-resources/**
      - method: GET
        path: /configuration/**
      - method: GET
        path: /swagger-ui/**
      - method: GET
        path: /webjars/**