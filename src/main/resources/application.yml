debug: true


server:
  port: 9092
 # ssl:
  #  key-store: classpath:static/security/keystore.p12
  #  key-store-password: mypassword
 #   key-password: mypassword
 #   key-alias: mykey

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true


spring:
  application:
    name: help-desk-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  liquibase:
    change-log: classpath:/db/changelog/master.yml
    enabled: true

logging:
 # config: classpath:logging/logback-master.xml
  level:
      org.springframework: DEBUG
      org.springframework.web: DEBUG
      org.springframework.web.socket: TRACE
      org.springframework.messaging: TRACE
      org.springframework.web.socket.messaging: TRACE
      org.springframework.web.socket.config: DEBUG
      org.springframework.web.socket.server: TRACE
      org.springframework.web.socket.handler: TRACE

      # Spring Security
      org.springframework.security: TRACE
      org.springframework.security.web: TRACE
      org.springframework.security.web.access: TRACE
      org.springframework.security.web.authentication: TRACE
      org.springframework.security.web.csrf: TRACE
      org.springframework.security.web.session: TRACE
      org.springframework.security.web.context: TRACE
      org.springframework.security.web.firewall: TRACE
      org.springframework.security.web.util: TRACE

      # Spring MVC
      org.springframework.web.servlet: DEBUG
      org.springframework.web.servlet.mvc: DEBUG
      org.springframework.web.servlet.handler: DEBUG

      # Spring Context
      org.springframework.context: DEBUG
      org.springframework.beans: DEBUG

      # WebSocket и STOMP
      org.springframework.messaging.simp: TRACE
      org.springframework.messaging.simp.stomp: TRACE
      org.springframework.messaging.simp.broker: TRACE
      org.springframework.messaging.simp.user: TRACE
      org.springframework.messaging.support: TRACE
      org.springframework.messaging.handler: TRACE

application:
  security:
    jwt:
      access-token:
        expiration: 1200 #minute - 20 hours
      refresh-token:
        length: 32
        expiration: 14400 #minute -> 10 day
      keys:
        public: ${JWT_PUBLIC_KEY_PATH:./src/main/resources/static/security/public_key.pem}
        private: ${JWT_PRIVATE_KEY_PATH:./src/main/resources/static/security/private_key.pem}

    admin:
      password: ${ADMIN_PASSWORD}

    cors-allowed-origins:
      - "http://localhost:3000"
      - "https://localhost:3000"
      - "http://localhost:9090"
      - "https://localhost:9090"
      - "http://localhost:9092"
      - "https://localhost:9092"
    public-endpoints:
      # api
      - method: POST
        path: /api/auth/*
      - method: GET
        path: /api/chats/*
      - method: POST
        path: /api/chats
      - method: POST
        path: /api/chats/{id}/messages
      - method: POST
        path: /api/chats/{id}/connections
      - method: POST
        path: /api/chats/{id}/message/client
      - method: POST
        path: /api/chats/{id}/close
      - method: GET

      # websocket
        path: /ws/**
      - method: GET

      # swagger
        path: /v2/api-docs
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /swagger-resources/**
      - method: GET
        path: /configuration/**
      - method: GET
        path: /swagger-ui/**
      - method: GET
        path: /webjars/**

