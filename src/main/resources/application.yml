# ===================================================================
# COMMON PROPERTIES (active for all profiles)
# ===================================================================
spring:
  application:
    name: help-desk-service
  profiles:
    active: dev # The 'dev' profile is active by default
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2KB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

application:
  security:
    jwt:
      access-token:
        expiration: 1200 #minute - 20 hours
      refresh-token:
        length: 32
        expiration: 14400 #minute -> 10 day
      keys:
        public: ${JWT_PUBLIC_KEY_PATH:./src/main/resources/static/security/public_key.pem}
        private: ${JWT_PRIVATE_KEY_PATH:./src/main/resources/static/security/private_key.pem}
    admin:
      password: ${ADMIN_PASSWORD}
    cors-allowed-origins:
      - "http://localhost:3000"
      - "https://localhost:3000"
      - "http://localhost:9090"
      - "https://localhost:9090"
      - "http://localhost:9092"
      - "https://localhost:9092"
      - "https://helpdesk.impuls-perm.ru"
      - "http://helpdesk.impuls-perm.ru"
    public-endpoints:
      # api
      - method: POST
        path: /api/auth/*
      - method: GET
        path: /api/chats/*
      - method: POST
        path: /api/chats/{id}/messages
      - method: POST
        path: /api/chats/{id}/connections
      - method: POST
        path: /api/chats/{id}/close
      - method: GET
        path: /login.html
      - method: GET
        path: /home.html
      - method: GET
        path: /login
      # websocket
      - method: GET
        path: /ws/**
      # swagger
      - method: GET
        path: /v2/api-docs
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /swagger-resources/**
      - method: GET
        path: /configuration/**
      - method: GET
        path: /swagger-ui/**
      - method: GET
        path: /webjars/**

logging:
  level:
    org.springframework.web: DEBUG
    org.apache.tomcat.util.http: DEBUG

huawei:
  push:
    app-id: ${HMS_APP_ID}
    client-id: ${HMS_CLIENT_ID}
    client-secret: ${HMS_CLIENT_SECRET}
  oauth-url: https://oauth-login.cloud.huawei.com/
  push-url: https://push-api.cloud.huawei.com/

---
# ===================================================================
# DEVELOPMENT PROFILE
# ===================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL_DEV:jdbc:postgresql://localhost:5432/helpdesk_dev}
    username: ${SPRING_DATASOURCE_USERNAME_DEV:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD_DEV:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  liquibase:
    change-log: classpath:/db/changelog/master.yml
    enabled: true

debug: true

server:
  port: 9092
  address: 10.222.222.174

logging:
  level:
    org.springframework: DEBUG
    ru.impuls.helpdeskservice: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.web: DEBUG

external:
  service:
    base-url: http://10.222.222.174:9998/api/

---
# ===================================================================
# PRODUCTION PROFILE
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL_PROD}
    username: ${SPRING_DATASOURCE_USERNAME_PROD}
    password: ${SPRING_DATASOURCE_PASSWORD_PROD}
  jpa:
    hibernate:
      ddl-auto: validate # Safer for production
  liquibase:
    change-log: classpath:/db/changelog/master.yml
    enabled: true # Enabled for production

debug: false

server:
  port: 9092
  #address: 10.222.222.43 # Listen on all interfaces in production

logging:
  level:
    org.springframework: INFO
    ru.impuls.helpdeskservice: INFO

external:
  service:
    base-url: http://77.236.64.205:9998/api/
